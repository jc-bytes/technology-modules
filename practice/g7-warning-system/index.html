const program = JSON.parse(document.getElementById('program').textContent);
const origin = 'https://trg-microbit.userpxt.io';
const boards = Array.from(document.querySelectorAll('iframe'));
const running = new Set();
const statusLine = document.getElementById('status');
const loadTimer = setTimeout(() => {
  if (running.size < 2) statusLine.textContent = 'The simulator is still loading. Check your connection to MakeCode and reload the page.';
}, 25000);
window.addEventListener('message', event => {
  if (event.origin !== origin) return;
  const board = boards.find(frame => frame.contentWindow === event.source);
  if (!board) return;
  const message = event.data;
  if (message?.type === 'ready') {
    const sender = board.id === 'sender';
    board.contentWindow.postMessage({
      ...program, id: board.id, frameCounter: sender ? 1 : 2,
      options: {theme: sender ? 'yellow' : 'green'}
    }, origin);
  } else if (message?.type === 'status' && message.state === 'running') {
    running.add(board);
    if (running.size === 2) {
      clearTimeout(loadTimer);
      statusLine.textContent = 'Both micro:bits are ready.';
    }
  } else if (message?.type === 'radiopacket') {
    const other = boards.find(frame => frame !== board);
    other.contentWindow.postMessage(message, origin);
  }
});
for (const board of boards) board.src = origin + '/---simulator#' + board.id;
</script>
