<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title"><title id="title">Final generator path requires teacher-approved input conditioning before A0; the Arduino and display receive USB power.</title><rect width="760" height="560" rx="18" fill="#eef5f0"/><g font-family="system-ui,sans-serif" fill="#173c33"><text x="30" y="45" font-size="28" font-weight="700">The final measuring path</text><rect x="35" y="130" width="210" height="100" rx="14" fill="#fff" stroke="#719885" stroke-width="2"/><text x="57" y="174" font-size="24">Turbine</text><text x="57" y="208" font-size="20">Measured first</text><path d="M245 180H315" stroke="#216b59" stroke-width="5"/><rect x="315" y="115" width="405" height="135" rx="14" fill="#fff5db" stroke="#9c772b" stroke-width="3"/><text x="339" y="155" font-size="24">Teacher-checked input circuit</text><text x="339" y="191" font-size="20">Correct scale, polarity and protection</text><text x="339" y="225" font-size="20">Chosen for this actual generator</text><path d="M520 250V305" stroke="#216b59" stroke-width="5"/><rect x="315" y="305" width="405" height="125" rx="14" fill="#fff" stroke="#719885" stroke-width="2"/><text x="339" y="346" font-size="24">A0 → Arduino code → display</text><text x="339" y="384" font-size="20">USB powers the Arduino.</text><text x="339" y="412" font-size="20">GND is the shared measuring reference.</text><text x="30" y="484" font-size="21">The AA battery divider is a bench lesson.</text><text x="30" y="520" font-size="21">It is not automatic approval for turbine wiring.</text></g></svg>