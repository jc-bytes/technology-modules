<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title"><title id="title">Known AA battery bench circuit: two 10 kilohm resistors halve the voltage before A0. This is not final turbine wiring.</title><rect width="760" height="560" rx="18" fill="#eef5f0"/><g font-family="system-ui,sans-serif" fill="#173c33"><text x="30" y="45" font-size="28" font-weight="700">First test: an AA battery</text><text x="30" y="80" font-size="21">Keep the turbine disconnected.</text><rect x="30" y="165" width="170" height="220" rx="14" fill="#fff" stroke="#719885" stroke-width="2"/><text x="65" y="235" font-size="25">AA battery</text><text x="55" y="275" font-size="21">about 1.5 V</text><text x="169" y="196" font-size="24">+</text><text x="170" y="360" font-size="24">−</text><path d="M200 185H285 M355 185H420V270 M420 335V420H200V355 M420 255H550" fill="none" stroke="#216b59" stroke-width="5"/><rect x="285" y="165" width="70" height="40" fill="#fff" stroke="#216b59" stroke-width="3"/><text x="267" y="147" font-size="22">10 kΩ top</text><rect x="400" y="270" width="40" height="65" fill="#fff" stroke="#216b59" stroke-width="3"/><text x="457" y="308" font-size="22">10 kΩ bottom</text><circle cx="420" cy="255" r="7" fill="#216b59"/><rect x="550" y="180" width="175" height="95" rx="12" fill="#fff" stroke="#216b59" stroke-width="2"/><text x="565" y="214" font-size="23">Arduino A0</text><text x="565" y="246" font-size="19">half the voltage</text><path d="M420 420H640V340" fill="none" stroke="#216b59" stroke-width="5"/><text x="555" y="330" font-size="23">Arduino GND</text><text x="30" y="478" font-size="21">USB powers the Arduino and its display.</text><text x="30" y="515" font-size="20">A0 reads the middle point. The code multiplies by 2.</text></g></svg>