<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" role="img" aria-labelledby="t d"><title id="t">Wind model energy path</title><desc id="d">A guarded classroom fan moves air toward the model blades. The blades turn a shaft and generator. A teacher-configured meter measures voltage. This is a concept drawing, not a wiring diagram.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#326c88" stroke-width="2"/></marker></defs><rect width="960" height="270" rx="14" fill="#f5f1e8"/><g font-family="Arial,sans-serif" fill="#17394e" text-anchor="middle"><text x="480" y="28" font-size="20" font-weight="bold">Air moves. Parts turn. The meter measures.</text><circle cx="90" cy="117" r="48" fill="#e5edf1" stroke="#17394e" stroke-width="3"/><g stroke="#567487" stroke-width="2"><path d="M42 117h96M90 69v96M56 83l68 68M56 151l68-68"/><circle cx="90" cy="117" r="30" fill="none"/></g><path d="M90 165v25M60 190h60" stroke="#17394e" stroke-width="5"/><text x="90" y="222" font-size="17">Guarded fan</text><g stroke="#326c88" stroke-width="3" marker-end="url(#arrow)"><path d="M158 96h90M158 119h90M158 142h90"/></g><text x="201" y="174" font-size="16">Moving air</text><g fill="#cee4dc" stroke="#17394e" stroke-width="3"><path d="M320 117L307 64Q337 53 337 96Z"/><path d="M320 117L364 149Q349 174 329 141Z"/><path d="M320 117L271 140Q254 112 296 110Z"/><circle cx="320" cy="117" r="9" fill="#17394e"/></g><text x="320" y="222" font-size="17">Model blades</text><path d="M334 117h118" stroke="#567487" stroke-width="8"/><text x="396" y="174" font-size="16">Shaft turns</text><rect x="452" y="82" width="132" height="70" rx="10" fill="#f4dca8" stroke="#17394e" stroke-width="3"/><text x="518" y="123" font-size="17">Generator</text><path d="M602 117h106" stroke="#326c88" stroke-width="3" marker-end="url(#arrow)"/><rect x="737" y="72" width="160" height="101" rx="12" fill="#e5edf1" stroke="#17394e" stroke-width="3"/><rect x="752" y="91" width="130" height="45" rx="4" fill="#fff"/><text x="817" y="122" font-size="24">volts V</text><text x="817" y="222" font-size="17">Checked meter</text><text x="480" y="254" font-size="14">Concept drawing. Ask your teacher to check the actual connections.</text></g></svg>
