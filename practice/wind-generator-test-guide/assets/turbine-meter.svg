<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title"><title id="title">Measure the generator using a multimeter only. Generator terminals to the voltage and COM probes. Teacher checks output type, voltage mode and polarity. Arduino remains disconnected.</title><rect width="760" height="560" rx="18" fill="#eef5f0"/><g font-family="system-ui,sans-serif" fill="#173c33"><text x="30" y="45" font-size="28" font-weight="700">Measure the turbine first</text><text x="30" y="83" font-size="21">No Arduino connection during this check.</text><rect x="30" y="175" width="210" height="220" rx="14" fill="#fff" stroke="#719885" stroke-width="2"/><text x="55" y="238" font-size="26">Generator</text><text x="55" y="277" font-size="21">Blades turn it.</text><text x="196" y="207" font-size="25">A</text><text x="196" y="365" font-size="25">B</text><rect x="430" y="130" width="290" height="305" rx="24" fill="#fff" stroke="#216b59" stroke-width="3"/><rect x="460" y="162" width="230" height="70" rx="6" fill="#e1eee5"/><text x="485" y="207" font-size="27">Read actual V</text><text x="475" y="279" font-size="25">Voltage mode</text><text x="463" y="315" font-size="20">Teacher checks type/range.</text><circle cx="493" cy="382" r="15" fill="#a23d34"/><circle cx="640" cy="382" r="15" fill="#283a35"/><text x="484" y="355" font-size="22">V</text><text x="613" y="355" font-size="22">COM</text><path d="M240 195H330V455H493V397" fill="none" stroke="#a23d34" stroke-width="5"/><path d="M240 355H285V490H640V397" fill="none" stroke="#283a35" stroke-width="5"/><text x="30" y="542" font-size="21">Use the V socket, never the A or mA socket, for voltage.</text></g></svg>