<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 286" role="img" aria-labelledby="t"><title id="t">A reading becomes a display</title><rect width="760" height="286" rx="16" fill="#edf5f2"/><text x="28" y="40" font-family="Arial" font-size="23" font-weight="bold" fill="#193b36">A reading becomes a display</text><rect x="24" y="74" width="712" height="52" rx="8" fill="white"/><text x="40" y="106" font-family="Arial" font-size="19" fill="#193b36">Sensor reads distance</text><text x="420" y="106" font-family="Arial" font-size="19" fill="#193b36">Input</text><rect x="24" y="140" width="712" height="52" rx="8" fill="white"/><text x="40" y="172" font-family="Arial" font-size="19" fill="#193b36">Program checks the rule</text><text x="420" y="172" font-family="Arial" font-size="19" fill="#193b36">Decision</text><rect x="24" y="206" width="712" height="52" rx="8" fill="white"/><text x="40" y="238" font-family="Arial" font-size="19" fill="#193b36">LED display shows ?, X or blank</text><text x="420" y="238" font-family="Arial" font-size="19" fill="#193b36">Output</text></svg>