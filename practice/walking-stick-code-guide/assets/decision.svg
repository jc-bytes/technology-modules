<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 286" role="img" aria-labelledby="t"><title id="t">Check validity before distance</title><rect width="760" height="286" rx="16" fill="#edf5f2"/><text x="28" y="40" font-family="Arial" font-size="23" font-weight="bold" fill="#193b36">Check validity before distance</text><rect x="24" y="74" width="712" height="52" rx="8" fill="white"/><text x="40" y="106" font-family="Arial" font-size="19" fill="#193b36">Reading unusable</text><text x="420" y="106" font-family="Arial" font-size="19" fill="#193b36">Show ?</text><rect x="24" y="140" width="712" height="52" rx="8" fill="white"/><text x="40" y="172" font-family="Arial" font-size="19" fill="#193b36">Valid and distance ≤ 30 cm</text><text x="420" y="172" font-family="Arial" font-size="19" fill="#193b36">Show X</text><rect x="24" y="206" width="712" height="52" rx="8" fill="white"/><text x="40" y="238" font-family="Arial" font-size="19" fill="#193b36">Valid and distance > 30 cm</text><text x="420" y="238" font-family="Arial" font-size="19" fill="#193b36">Clear display</text></svg>