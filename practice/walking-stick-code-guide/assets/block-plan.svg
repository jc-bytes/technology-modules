<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" role="img" aria-labelledby="t"><title id="t">One repeating decision</title><rect width="760" height="352" rx="16" fill="#edf5f2"/><text x="28" y="40" font-family="Arial" font-size="23" font-weight="bold" fill="#193b36">One repeating decision</text><rect x="24" y="74" width="712" height="52" rx="8" fill="white"/><text x="40" y="106" font-family="Arial" font-size="19" fill="#193b36">1. Read sensor once</text><text x="420" y="106" font-family="Arial" font-size="19" fill="#193b36">distanceCm</text><rect x="24" y="140" width="712" height="52" rx="8" fill="white"/><text x="40" y="172" font-family="Arial" font-size="19" fill="#193b36">2. Check that reading</text><text x="420" y="172" font-family="Arial" font-size="19" fill="#193b36">readingValid</text><rect x="24" y="206" width="712" height="52" rx="8" fill="white"/><text x="40" y="238" font-family="Arial" font-size="19" fill="#193b36">3. If valid: compare with 30</text><text x="420" y="238" font-family="Arial" font-size="19" fill="#193b36">X or clear</text><rect x="24" y="272" width="712" height="52" rx="8" fill="white"/><text x="40" y="304" font-family="Arial" font-size="19" fill="#193b36">4. Else: unusable reading</text><text x="420" y="304" font-family="Arial" font-size="19" fill="#193b36">?</text></svg>