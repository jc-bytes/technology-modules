.blocklyDropDownContent { max-height: 300px; overflow: hidden auto; position: relative; }
.blocklyDropDownArrow { position: absolute; left: 0px; top: 0px; width: 16px; height: 16px; z-index: -1; background-color: inherit; border-color: inherit; }
.blocklyDropDownButton { display: inline-block; float: left; padding: 0px; margin: 4px; border-radius: 4px; outline: none; border: 1px solid; transition: box-shadow 0.1s; cursor: pointer; }
.blocklyArrowTop { border-top-width: 1px; border-top-style: solid; border-left-width: 1px; border-left-style: solid; border-top-left-radius: 4px; border-color: inherit; }
.blocklyArrowBottom { border-bottom-width: 1px; border-bottom-style: solid; border-right-width: 1px; border-right-style: solid; border-bottom-right-radius: 4px; border-color: inherit; }
.blocklyResizeSE { cursor: se-resize; fill: rgb(170, 170, 170); }
.blocklyResizeSW { cursor: sw-resize; fill: rgb(170, 170, 170); }
.blocklyResizeLine { stroke: rgb(81, 90, 90); stroke-width: 1; }
.blocklyHighlightedConnectionPath { fill: none; stroke: rgb(255, 204, 51); stroke-width: 4px; }
.blocklyPathLight { fill: none; stroke-linecap: round; stroke-width: 1; }
.blocklySelected &gt; .blocklyPathLight { display: none; }
.blocklyDraggable { cursor: -webkit-grab; }
