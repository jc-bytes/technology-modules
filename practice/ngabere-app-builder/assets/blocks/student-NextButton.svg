.blocklySvg { background-color: rgb(255, 255, 255); outline: none; overflow: hidden; position: absolute; display: block; }
.blocklyWidgetDiv { display: none; position: absolute; z-index: 99999; }
.injectionDiv { height: 100%; position: relative; overflow: hidden; touch-action: none; user-select: none; }
.blocklyNonSelectable { user-select: none; }
.blocklyBlockCanvas.blocklyCanvasTransitioning, .blocklyBubbleCanvas.blocklyCanvasTransitioning { transition: transform 0.5s; }
.blocklyTooltipDiv { background-color: rgb(255, 255, 199); border: 1px solid rgb(221, 221, 204); box-shadow: rgba(0, 0, 0, 0.15) 4px 4px 20px 1px; color: rgb(0, 0, 0); display: none; font: 9pt sans-serif; opacity: 0.9; padding: 2px; position: absolute; z-index: 100000; }
.blocklyDropDownDiv { position: absolute; left: 0px; top: 0px; z-index: 1000; display: none; border: 1px solid rgb(218, 220, 224); background-color: rgb(255, 255, 255); border-radius: 2px; padding: 4px; box-shadow: rgba(0, 0, 0, 0.3) 0px 0px 3px 1px; }
