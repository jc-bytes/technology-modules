.blocklyFlyout .blocklyScrollbarHandle { fill: rgb(187, 187, 187); }
.blocklyFlyout .blocklyScrollbarBackground:hover + .blocklyScrollbarHandle, .blocklyFlyout .blocklyScrollbarHandle:hover { fill: rgb(170, 170, 170); }
.blocklyInvalidInput { background: rgb(255, 170, 170); }
