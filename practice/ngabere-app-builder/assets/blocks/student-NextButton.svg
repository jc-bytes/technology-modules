.blocklyIconGroup { cursor: default; }
.blocklyIconGroup:not(:hover), .blocklyIconGroupReadonly { opacity: 0.6; }
.blocklyIconShape { fill: rgb(0, 0, 255); stroke: rgb(255, 255, 255); stroke-width: 1px; }
.blocklyIconSymbol { fill: rgb(255, 255, 255); }
.blocklyMinimalBody { margin: 0px; padding: 0px; height: 100%; }
.blocklyHtmlInput { border-width: medium; border-style: none; border-color: currentcolor; border-image: none; border-radius: 4px; height: 100%; margin: 0px; outline: none; padding: 0px; width: 100%; text-align: center; display: block; box-sizing: border-box; }
input.blocklyHtmlInput[type="number"]::-webkit-inner-spin-button, input.blocklyHtmlInput[type="number"]::-webkit-outer-spin-button { appearance: none; margin: 0px; }
