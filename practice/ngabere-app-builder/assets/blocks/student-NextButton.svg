<svg xmlns="http://www.w3.org/2000/svg" class="blocklySvg geras-renderer classic-theme" width="226" height="93" viewBox="-12 -12 226 93"><style>.geras-renderer.classic-theme .blocklyText, .geras-renderer.classic-theme .blocklyFlyoutLabelText { font: 11pt sans-serif; }
.geras-renderer.classic-theme .blocklyText { fill: rgb(255, 255, 255); }
