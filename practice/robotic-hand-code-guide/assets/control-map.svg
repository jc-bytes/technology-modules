<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">Hand program control map</title><desc id="desc">Three knobs control motors one through three. Buttons S1 and S3 control motor four. Buttons S2 and S4 control motor five. These are code commands, not measured safe angles.</desc>
<rect width="1000" height="620" rx="24" fill="#f4f7fb"/>
<g font-family="Arial, sans-serif" fill="#182b45"><text x="42" y="52" font-size="28" font-weight="700">Read a control → send a motor command</text><text x="42" y="86" font-size="20">Existing connections. Keep the wiring. Ask the teacher before Upload.</text></g>
<g font-family="Arial, sans-serif" font-size="23" fill="#182b45">
<rect x="36" y="116" width="928" height="72" rx="14" fill="#fff"/><text x="58" y="146">Knob 1 · A1</text><text x="340" y="146">→ Motor 1 · D6</text><text x="650" y="146">commands 0 to 57</text><text x="58" y="174" font-size="17">Read → map → write</text>
<rect x="36" y="198" width="928" height="72" rx="14" fill="#fff"/><text x="58" y="228">Knob 2 · A2</text><text x="340" y="228">→ Motor 2 · D7</text><text x="650" y="228">commands 0 to 180</text><text x="58" y="256" font-size="17">Read → map → write</text>
<rect x="36" y="280" width="928" height="72" rx="14" fill="#fff"/><text x="58" y="310">Knob 3 · A3</text><text x="340" y="310">→ Motor 3 · D8</text><text x="650" y="310">commands 0 to 90</text><text x="58" y="338" font-size="17">Read → map → write</text>
<rect x="36" y="362" width="928" height="80" rx="14" fill="#e2f4f0"/><text x="58" y="393">S1 · D2: decrease</text><text x="340" y="393">→ Motor 4 · D9</text><text x="650" y="393">90 to 160</text><text x="58" y="424">S3 · D4: increase</text><text x="650" y="424" font-size="18">starts at 125</text>
<rect x="36" y="452" width="928" height="80" rx="14" fill="#e2f4f0"/><text x="58" y="483">S2 · D3: decrease</text><text x="340" y="483">→ Motor 5 · D10</text><text x="650" y="483">0 to 176</text><text x="58" y="514">S4 · D5: increase</text><text x="650" y="514" font-size="18">starts at 86</text>
<text x="42" y="574" font-size="21" font-weight="700">Command numbers do not prove physical angles or safe movement.</text><text x="42" y="603" font-size="18">Use one control at a time. The teacher checks power, startup and allowed movement.</text></g></svg>
