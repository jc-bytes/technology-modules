<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scratch Delivery Workshop</title><style>:root {
  font-family: Arial, sans-serif;
  color: #102f40;
  background: #fbfaf3;
  --navy: #15435c;
  --deep: #0f3041;
  --teal: #177c72;
  --yellow: #f5b91d;
  --paper: #fbfaf3;
  --line: #b9c9d0;
  --muted: #536d7a;
  --green: #e3f4ec;
  --red: #a64135;
  --redsoft: #fae8e4;
}
.fm-io-flow {
  grid-template-columns: 1fr auto 1fr auto 1fr !important;
  gap: 14px;
}
.fm-io-flow div {
  padding: 24px 12px;
}
.fm-io-flow small {
  color: var(--teal);
  font-weight: 800;
}
.fm-organizer-stage {
  overflow: hidden;
}
.fm-organizer {
  position: absolute;
  background: #268b82;
  border: 4px solid #155b56;
  box-shadow: 10px 10px 0 #123f5850;
}
.fm-organizer.base {
  width: 380px;
  height: 42px;
  bottom: 48px;
  left: calc(50% - 190px);
}
.fm-organizer.cup {
  width: 110px;
  height: 180px;
  bottom: 86px;
  left: calc(50% - 150px);
}
.fm-organizer.tray {
  width: 190px;
  height: 70px;
  bottom: 86px;
  left: calc(50% - 20px);
}
.fm-board-map {
  width: min(100%, 620px);
  min-height: 310px;
  display: grid;
  grid-template-columns: 90px 1fr 90px;
  gap: 22px;
  align-items: center;
  margin: 25px auto;
  padding: 35px;
  border-radius: 42px;
  background: #174960;
}
.fm-board-map .fm-led-grid {
  width: 220px;
  height: 220px;
  justify-self: center;
}
.fm-board-button {
  width: 70px;
  height: 70px;
  display: grid;
  place-items: center;
  border: 7px solid #d9b635;
  border-radius: 50%;
  background: #f4e29a;
  color: #102f40;
  font-size: 27px;
  font-weight: 800;
}
.fm-variable-demo {
  display: grid;
  grid-template-columns: 150px 1fr;
  margin: 25px 0;
  border: 2px solid var(--navy);
}
.fm-variable-demo > * {
  padding: 18px;
  border-bottom: 1px solid var(--line);
}
.fm-variable-demo span {
  background: #dcebf0;
  font-weight: 800;
}
.fm-variable-demo strong {
  font-size: 24px;
}
.fm-opening {
  display: grid;
  grid-template-columns: 1fr 1.2fr;
  gap: 30px;
  align-items: center;
}
.fm-opening .fm-io-flow {
  grid-template-columns: 1fr !important;
  gap: 8px;
}
.fm-opening .fm-io-flow > span {
  transform: rotate(90deg);
  text-align: center;
}
.fm-note {
  margin: 22px 0;
  padding: 20px;
  border-left: 7px solid var(--yellow);
  background: #fff2bd;
  line-height: 1.55;
}
@media (max-width: 700px) {
  .fm-opening {
    grid-template-columns: 1fr;
  }
  .fm-board-map {
    grid-template-columns: 55px 1fr 55px;
    padding: 22px 12px;
    gap: 8px;
  }
  .fm-board-map .fm-led-grid {
    width: 180px;
    height: 180px;
  }
  .fm-board-button {
    width: 50px;
    height: 50px;
    border-width: 5px;
  }
  .fm-organizer.base {
    width: 280px;
    left: calc(50% - 140px);
  }
  .fm-organizer.cup {
    left: calc(50% - 115px);
  }
  .fm-organizer.tray {
    width: 145px;
    left: calc(50% - 5px);
  }
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: var(--paper);
  font-size: 18px;
}
.fm-shell {
  min-height: 100vh;
}
.fm-topbar {
  height: 82px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  position: sticky;
  top: 0;
  z-index: 10;
  padding: 0 max(24px, calc((100vw - 1040px) / 2));
  border-bottom: 2px solid var(--line);
  background: rgba(251, 250, 243, 0.97);
}
.fm-brand {
  display: flex;
  gap: 12px;
  align-items: center;
  color: var(--deep);
  text-decoration: none;
}
.fm-brand > span {
  width: 50px;
  height: 50px;
  display: grid;
  place-items: center;
  border-radius: 10px;
  background: var(--yellow);
  font-size: 20px;
  font-weight: 800;
}
.fm-brand div {
  display: grid;
}
.fm-brand small {
  color: var(--muted);
  font-size: 13px;
}
.fm-brand strong {
  font-size: 19px;
}
.fm-history {
  display: grid;
  text-align: right;
}
.fm-history strong {
  font-size: 14px;
}
.fm-history small {
  color: var(--teal);
  font-size: 13px;
  font-weight: 800;
}
.fm-menu {
  position: relative;
}
.fm-menu summary,
.fm-button {
  border: 0;
  border-radius: 9px;
  cursor: pointer;
  font: inherit;
  font-weight: 800;
}
.fm-menu summary {
  padding: 13px 20px;
  background: var(--navy);
  color: white;
  list-style: none;
}
.fm-menu nav {
  width: 330px;
  max-height: 75vh;
  overflow: auto;
  display: grid;
  position: absolute;
  right: 0;
  top: 58px;
  padding: 12px;
  border: 2px solid var(--navy);
  border-radius: 10px;
  background: white;
  box-shadow: 0 18px 50px #102f4030;
}
.fm-nav-link {
  min-height: 48px;
  display: grid;
  grid-template-columns: 28px 1fr auto;
  gap: 10px;
  align-items: center;
  padding: 7px 9px;
  border-radius: 7px;
  color: var(--deep);
  text-decoration: none;
}
.fm-nav-link:hover,
.fm-nav-link.is-active {
  background: #e7f1f5;
}
.fm-nav-link small {
  color: var(--muted);
  font-size: 12px;
}
.fm-nav-dot {
  width: 23px;
  height: 23px;
  display: grid;
  place-items: center;
  border: 2px solid var(--line);
  border-radius: 50%;
  font-size: 12px;
}
.fm-nav-dot.is-done {
  border-color: var(--teal);
  background: var(--teal);
  color: white;
}
.fm-nav-dot.is-started {
  border-color: var(--yellow);
}
#fm-main {
  width: min(920px, calc(100% - 40px));
  margin: auto;
  padding: 64px 0 80px;
  outline: 0;
}
.fm-hero {
  margin-bottom: 46px;
  padding-bottom: 38px;
  border-bottom: 3px solid var(--yellow);
}
.fm-hero > p,
.fm-label {
  margin: 0 0 10px;
  color: var(--teal);
  font-size: 15px;
  font-weight: 800;
  text-transform: uppercase;
}
.fm-hero h1 {
  margin: 0;
  color: var(--deep);
  font-size: clamp(42px, 7vw, 68px);
  line-height: 1.02;
  letter-spacing: -2px;
}
.fm-hero > div {
  max-width: 800px;
  margin-top: 20px;
  color: var(--muted);
  font-size: 22px;
  line-height: 1.45;
}
.fm-block {
  padding: 35px 0;
  border-bottom: 2px solid var(--line);
}
.fm-block h2 {
  margin: 0 0 18px;
  color: var(--deep);
  font-size: 31px;
}
.fm-block p {
  line-height: 1.55;
}
.fm-lead {
  font-size: 21px;
  color: var(--muted);
}
.fm-concept-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
}
.fm-concept-grid > div {
  padding: 20px;
  border-left: 6px solid var(--teal);
  background: white;
}
.fm-concept-grid h3 {
  margin: 0 0 6px;
  font-size: 22px;
}
.fm-concept-grid p {
  margin: 0;
  color: var(--muted);
}
.fm-callout {
  padding: 22px;
  border-left: 7px solid var(--yellow);
  background: #fff2bd;
  line-height: 1.5;
}
.fm-steps {
  display: grid;
  gap: 14px;
  padding: 0;
  list-style: none;
  counter-reset: steps;
}
.fm-steps li {
  display: grid;
  grid-template-columns: 42px 1fr;
  gap: 14px;
  align-items: start;
}
.fm-steps li:before {
  counter-increment: steps;
  content: counter(steps);
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--navy);
  color: white;
  font-weight: 800;
}
.fm-set {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 24px;
  align-items: center;
  margin-bottom: 20px;
  padding: 22px;
  border: 2px solid var(--navy);
  border-radius: 10px;
  background: white;
}
.fm-set > div {
  display: grid;
  gap: 4px;
}
.fm-set > div > span {
  color: var(--teal);
  font-size: 14px;
  font-weight: 800;
  text-transform: uppercase;
}
.fm-set strong {
  font-size: 27px;
}
.fm-set small {
  color: var(--muted);
}
.fm-set ol {
  display: flex;
  gap: 9px;
  margin: 0;
  padding: 0;
  list-style: none;
}
.fm-set li {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border: 2px solid #8199a5;
  border-radius: 50%;
  font-weight: 800;
}
.fm-set li.done {
  border-color: var(--teal);
  background: var(--teal);
  color: white;
}
.fm-set li.current {
  border-color: var(--navy);
  background: var(--yellow);
  box-shadow:
    0 0 0 3px white,
    0 0 0 5px var(--navy);
}
.fm-question {
  font-size: 23px;
  font-weight: 800;
}
.fm-choices {
  display: grid;
  gap: 12px;
  margin: 20px 0;
}
.fm-choice input {
  position: absolute;
  opacity: 0;
}
.fm-choice span {
  min-height: 58px;
  display: grid;
  grid-template-columns: 38px 1fr;
  gap: 13px;
  align-items: center;
  padding: 11px 15px;
  border: 2px solid #78919e;
  border-radius: 9px;
  background: white;
  cursor: pointer;
}
.fm-choice b {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: #e6eef2;
}
.fm-choice input:checked + span {
  border-color: var(--teal);
  background: var(--green);
  box-shadow: inset 0 0 0 1px var(--teal);
}
.fm-choice input:focus-visible + span {
  outline: 4px solid var(--yellow);
  outline-offset: 3px;
}
.fm-button {
  min-height: 48px;
  padding: 11px 18px;
}
.fm-button.primary {
  background: var(--navy);
  color: white;
}
.fm-button.quiet {
  border: 2px solid var(--navy);
  background: white;
  color: var(--navy);
}
.fm-button.large {
  min-height: 56px;
  font-size: 19px;
}
.fm-feedback {
  display: grid;
  gap: 7px;
  margin-top: 20px;
  padding: 18px;
  border-left: 6px solid;
}
.fm-feedback.success {
  border-color: var(--teal);
  background: var(--green);
  color: #195438;
}
.fm-feedback.retry {
  border-color: var(--red);
  background: var(--redsoft);
  color: #742c26;
}
.fm-feedback .fm-button {
  width: max-content;
  margin-top: 8px;
}
.fm-record-form {
  display: grid;
  gap: 18px;
}
.fm-field {
  display: grid;
  gap: 7px;
  font-weight: 800;
}
.fm-field input,
.fm-field textarea,
.fm-field select {
  width: 100%;
  min-height: 52px;
  padding: 11px 13px;
  border: 2px solid #78919e;
  border-radius: 8px;
  background: white;
  color: var(--deep);
  font: inherit;
}
.fm-field textarea {
  resize: vertical;
}
.fm-field small {
  color: var(--muted);
  font-size: 14px;
  font-weight: 400;
}
.fm-pager {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
  margin-top: 30px;
  padding-top: 28px;
  border-top: 2px solid var(--line);
}
.fm-pager a {
  min-height: 58px;
  display: flex;
  align-items: center;
  padding: 14px 18px;
  border: 2px solid var(--navy);
  border-radius: 9px;
  color: var(--navy);
  font-weight: 800;
  text-decoration: none;
}
.fm-pager .next {
  justify-content: flex-end;
  background: var(--navy);
  color: white;
}
.fm-summary {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  margin-bottom: 32px;
}
.fm-summary div {
  padding: 20px;
  border-top: 6px solid var(--teal);
  background: var(--green);
}
.fm-summary strong,
.fm-summary span {
  display: block;
}
.fm-summary strong {
  font-size: 34px;
}
.fm-history-list {
  margin-bottom: 28px;
}
.fm-attempt {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 20px;
  align-items: center;
  padding: 18px 0;
  border-bottom: 2px solid var(--line);
}
.fm-attempt h3 {
  margin: 4px 0;
}
.fm-attempt p,
.fm-attempt small {
  margin: 0;
  color: var(--muted);
}
.fm-empty {
  padding: 25px;
  border-left: 6px solid var(--yellow);
  background: #fff2bd;
}
.fm-footer {
  width: min(920px, calc(100% - 40px));
  margin: auto;
  padding: 0 0 50px;
  color: var(--muted);
  font-size: 15px;
}
.fm-footer details {
  padding-top: 20px;
  border-top: 2px solid var(--line);
}
.fm-footer summary {
  color: var(--navy);
  font-weight: 800;
  cursor: pointer;
}
.fm-footer a {
  color: var(--navy);
}
.fm-footer p {
  margin: 10px 0;
}
.fm-text-button {
  display: block;
  margin-top: 10px;
  padding: 0;
  border: 0;
  background: none;
  color: var(--red);
  text-decoration: underline;
  cursor: pointer;
}
.fm-toast {
  position: fixed;
  right: 22px;
  bottom: 22px;
  padding: 15px 18px;
  border-radius: 9px;
  background: var(--deep);
  color: white;
  opacity: 0;
  transform: translateY(10px);
  pointer-events: none;
  transition: 0.18s;
}
.fm-toast.show {
  opacity: 1;
  transform: none;
}
dialog {
  width: min(700px, calc(100vw - 30px));
  padding: 25px;
  border: 0;
  border-radius: 13px;
  background: var(--paper);
  box-shadow: 0 25px 80px #102f4060;
}
dialog::backdrop {
  background: #0d2b3bbb;
}
.fm-dialog-heading {
  display: flex;
  justify-content: space-between;
  align-items: start;
  margin-bottom: 20px;
}
.fm-dialog-heading h2 {
  margin: 4px 0;
}
.fm-dialog-heading small {
  color: var(--teal);
  font-weight: 800;
  text-transform: uppercase;
}
.fm-dialog-heading button {
  border: 0;
  background: none;
  color: var(--navy);
  font-size: 30px;
  cursor: pointer;
}
#fm-export-form {
  display: grid;
  gap: 17px;
}
#fm-export-form label {
  display: grid;
  gap: 8px;
  font-weight: 800;
}
#fm-export-form input,
#fm-export-form select {
  min-height: 52px;
  padding: 10px;
  border: 2px solid #78919e;
  border-radius: 8px;
  font: inherit;
}
.fm-recreated dl div {
  display: grid;
  grid-template-columns: 160px 1fr;
  gap: 14px;
  padding: 8px 0;
  border-bottom: 1px solid var(--line);
}
.fm-recreated dt {
  font-weight: 800;
}
.fm-recreated dd {
  margin: 0;
}
.fm-object-stage {
  min-height: 320px;
  display: grid;
  place-items: center;
  position: relative;
  margin: 22px 0;
  border: 2px solid #8aa0aa;
  background:
    linear-gradient(
      30deg,
      #eef3f4 12%,
      transparent 12.5%,
      transparent 87%,
      #eef3f4 87.5%
    ),
    linear-gradient(
      150deg,
      #eef3f4 12%,
      transparent 12.5%,
      transparent 87%,
      #eef3f4 87.5%
    ),
    linear-gradient(
      30deg,
      #eef3f4 12%,
      transparent 12.5%,
      transparent 87%,
      #eef3f4 87.5%
    ),
    #fff;
  background-size: 80px 140px;
  background-position:
    0 0,
    0 0,
    40px 70px;
}
.fm-cube {
  width: 150px;
  height: 150px;
  position: relative;
  transform: rotate(-18deg) skewY(8deg);
  background: #2d8f86;
  box-shadow: 52px -35px 0 #67b8ad;
}
.fm-cube:after {
  content: "";
  width: 52px;
  height: 150px;
  position: absolute;
  right: -52px;
  top: -17px;
  transform: skewY(-34deg);
  background: #176c66;
}
.fm-dim {
  position: absolute;
  padding: 5px 9px;
  border-radius: 6px;
  background: var(--yellow);
  font-weight: 800;
}
.fm-dim.width {
  bottom: 32px;
}
.fm-dim.height {
  left: 13%;
  top: 45%;
}
.fm-dim.depth {
  right: 12%;
  top: 24%;
}
.fm-model-actions {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}
.fm-model-actions div {
  padding: 16px;
  background: white;
  border-top: 5px solid var(--teal);
  text-align: center;
}
.fm-sensor-lab {
  display: grid;
  grid-template-columns: 300px 1fr;
  gap: 34px;
  align-items: start;
}
.fm-microbit {
  min-height: 300px;
  display: grid;
  place-items: center;
  padding: 30px;
  border-radius: 38px;
  background: #174960;
  color: white;
}
.fm-led-grid {
  width: 190px;
  height: 190px;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  padding: 16px;
  border-radius: 12px;
  background: #0d2937;
}
.fm-led-grid i {
  border-radius: 4px;
  background: #2f4f5d;
}
.fm-led-grid i.on {
  background: #ffd44b;
  box-shadow: 0 0 9px #ffd44b;
}
.fm-rule {
  padding: 17px;
  border-left: 6px solid var(--yellow);
  background: #fff2bd;
}
.fm-io-flow {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 20px;
  align-items: center;
  margin: 20px 0;
}
.fm-io-flow div {
  padding: 24px;
  border: 2px solid var(--navy);
  background: white;
  text-align: center;
}
.fm-io-flow b {
  font-size: 27px;
}
.fm-code-stack {
  display: grid;
  gap: 8px;
  padding: 20px;
  background: #eef3f4;
}
.fm-code-block {
  width: max-content;
  max-width: 100%;
  padding: 11px 16px;
  border-radius: 8px;
  background: #4f78c6;
  color: white;
  font-weight: 800;
}
.fm-code-block.event {
  background: #d4a51b;
  color: #102f40;
}
.fm-code-block.variable {
  margin-left: 28px;
  background: #b34e9c;
}
.fm-code-block.logic {
  margin-left: 28px;
  background: #3f8f68;
}
.fm-code-block.output {
  margin-left: 56px;
  background: #207caa;
}
.fm-table-wrap {
  margin: 24px 0;
  overflow-x: auto;
}
.fm-table-wrap table {
  width: 100%;
  border-collapse: collapse;
  background: #fff;
  font-size: 1rem;
}
.fm-table-wrap caption {
  padding: 12px 16px;
  background: var(--ink, var(--navy));
  color: #fff;
  font-weight: 800;
  text-align: left;
}
.fm-table-wrap th,
.fm-table-wrap td {
  border: 1px solid #89a5b2;
  padding: 12px 14px;
  text-align: left;
  vertical-align: top;
}
.fm-table-wrap th {
  background: #dcebf0;
}
.fm-code-card,
.fm-source-card {
  margin: 22px 0;
  padding: 22px;
  border: 2px solid #9bb7c3;
  background: #f4fafb;
}
.fm-code-card code {
  display: block;
  margin-top: 10px;
  font:
    1rem/1.7 ui-monospace,
    SFMono-Regular,
    Menlo,
    Consolas,
    monospace;
  white-space: normal;
}
.fm-source-card p {
  margin: 5px 0;
}
.fm-flow {
  display: flex;
  align-items: stretch;
  justify-content: center;
  gap: 10px;
  margin: 24px 0;
}
.fm-flow span {
  display: grid;
  min-height: 72px;
  flex: 1;
  place-items: center;
  padding: 12px;
  border: 2px solid #77a8b5;
  background: #e9f7f6;
  font-weight: 800;
  text-align: center;
}
.fm-flow b {
  align-self: center;
  color: var(--teal);
}
.fm-pixel-grid {
  display: grid;
  grid-template-columns: repeat(4, 44px);
  gap: 4px;
  width: max-content;
  margin: 20px auto;
