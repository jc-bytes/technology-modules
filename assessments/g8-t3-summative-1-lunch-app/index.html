<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#15435c">
  <title>Complete your lunch app | Grade 8 Summative 1</title>
  <link rel="stylesheet" href="./shared/foundation-module.css">
  <link rel="stylesheet" href="./app.css?v=20260924o">
</head>
<body>
  <div class="fm-shell">
    <header class="fm-topbar">
      <a class="fm-brand" href="#name" aria-label="Technology home">
        <div><small>Technology</small><strong>Complete your lunch app</strong></div>
      </a>
      <div class="fm-tools">
        <div id="student-summary" class="student-summary"><strong id="student-summary-name">Your name</strong><span id="student-summary-grade">Your grade</span></div>
        <button id="edit-identity" class="fm-button quiet header-edit" type="button" aria-label="Edit name and grade">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 16.5V20h3.5L19 8.5 15.5 5 4 16.5Z"/><path d="m13.5 7 3.5 3.5"/></svg>
        </button>
        <button id="download-pdf" class="fm-button primary header-download" type="button">Download your answers</button>
        <details id="step-menu" class="fm-menu">
          <summary><span>Steps</span></summary>
          <nav id="step-navigation" aria-label="Assessment steps"></nav>
        </details>
      </div>
    </header>
    <div id="save-warning" role="status" aria-live="polite"></div>
    <main id="fm-main" tabindex="-1"></main>
  </div>
  <dialog id="identity-dialog" aria-labelledby="identity-title">
    <form id="identity-form" method="dialog">
      <div class="fm-dialog-heading">
        <div><small>Student details</small><h2 id="identity-title">Your name and grade</h2></div>
        <button type="button" id="close-identity" aria-label="Close">×</button>
      </div>
      <label class="fm-field">First name
        <input id="dialog-first-name" name="given-name" maxlength="60" autocomplete="given-name">
      </label>
      <label class="fm-field">Last name
        <input id="dialog-last-name" name="family-name" maxlength="60" autocomplete="family-name">
      </label>
      <label class="fm-field">Grade
        <input id="dialog-grade" name="grade" maxlength="12" autocomplete="off">
      </label>
      <button class="fm-button primary" type="submit">Save details</button>
    </form>
  </dialog>
  <div id="toast" class="fm-toast" role="status" aria-live="polite"></div>
  <script type="module" src="./main.js?v=20260924o"></script>
</body>
</html>
